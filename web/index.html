<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f3d32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scrabble Score" />
    <meta name="description" content="Local Scrabble score counter for iPhone" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Scrabble Score</title>
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="false">
      <div class="splash-tile" aria-hidden="true">S</div>
      <p class="splash-brand">Scrabble Score</p>
      <p class="splash-sub">Loading your games…</p>
    </div>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <button id="backBtn" class="icon-btn" type="button" hidden aria-label="Back">
          ←
        </button>
        <div class="brand-block">
          <p class="brand">Scrabble Score</p>
          <p id="screenTitle" class="screen-title">Home</p>
        </div>
      </header>

      <main id="screen" class="screen"></main>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
